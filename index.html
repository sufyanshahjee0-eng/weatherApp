<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: #fff; overflow-x: hidden;
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      background: linear-gradient(180deg, #2f80ed, #56ccf2) fixed;
      --cloud: #fff; --cloud-op: .4;
    }
    body.sunny  { background: linear-gradient(180deg, #2f80ed, #6dd5fa) fixed; --cloud-op: .45; }
    body.partly { --cloud-op: .85; }
    body.night  { background: linear-gradient(180deg, #0b1026, #1b2a52 60%, #2c3e70) fixed; --cloud-op: .15; }
    body.cloudy { background: linear-gradient(180deg, #4b5d77, #8497b0) fixed; --cloud: #e4e9f0; --cloud-op: .75; }
    body.rain   { background: linear-gradient(180deg, #2b3a4d, #4b6079) fixed; --cloud: #aab4c2; --cloud-op: .8; }
    body.storm  { background: linear-gradient(180deg, #111a2b, #2a3b57) fixed; --cloud: #6b7688; --cloud-op: .9; }
    body.snow   { background: linear-gradient(180deg, #6f8fc4, #b4c6e2) fixed; --cloud: #fff; --cloud-op: .6; }
    body.fog    { background: linear-gradient(180deg, #6b7280, #a7afbb) fixed; --cloud: #e5e7eb; --cloud-op: .7; }

    #fx { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .wrap { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding: 18px 14px 40px; }

    /* Sun and moon */
    #sun, #moon { position: fixed; display: none; z-index: 0; }
    #sun { top: 40px; right: 30px; width: 90px; height: 90px; border-radius: 50%;
      background: radial-gradient(circle, #fff8c4, #ffd93b 60%, #ffb800);
      box-shadow: 0 0 60px 20px rgba(255, 220, 80, .6); animation: pulse 4s ease-in-out infinite; }
    #moon { top: 45px; right: 40px; width: 70px; height: 70px; border-radius: 50%;
      background: #f5f3e7; box-shadow: inset -14px -4px 0 0 #d9d6c2, 0 0 40px 10px rgba(255, 255, 255, .25); }
    body.sunny #sun { display: block; }
    body.night #moon { display: block; }
    @keyframes pulse { 50% { box-shadow: 0 0 80px 30px rgba(255, 220, 80, .7); } }

    /* Clouds */
    .cloud { position: absolute; left: 0; width: 10em; height: 3em; border-radius: 3em; background: var(--cloud); opacity: var(--cloud-op); animation: drift linear infinite; }
    .cloud::before, .cloud::after { content: ""; position: absolute; background: inherit; border-radius: 50%; }
    .cloud::before { width: 4.6em; height: 4.6em; top: -2.2em; left: 1.4em; }
    .cloud::after  { width: 3.6em; height: 3.6em; top: -1.6em; left: 5em; }
    @keyframes drift { from { transform: translateX(-320px); } to { transform: translateX(calc(100vw + 320px)); } }

    /* Rain, snow, stars, lightning */
    .drop { position: absolute; top: -40px; width: 2px; height: 18px; background: rgba(255, 255, 255, .55); animation: fall linear infinite; }
    .flake { position: absolute; top: -20px; background: #fff; border-radius: 50%; opacity: .85; animation: fall linear infinite; }
    @keyframes fall { to { transform: translateY(115vh); } }
    .star { position: absolute; width: 2px; height: 2px; background: #fff; border-radius: 50%; animation: twinkle 3s ease-in-out infinite; }
    @keyframes twinkle { 50% { opacity: .15; } }
    .flash { position: fixed; inset: 0; background: #fff; opacity: 0; animation: flash 7s infinite; }
    @keyframes flash { 0%, 89%, 100% { opacity: 0; } 90% { opacity: .55; } 91% { opacity: 0; } 92% { opacity: .8; } 94% { opacity: 0; } }

    /* Glass look */
    .glass { background: rgba(255, 255, 255, .16); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, .28); border-radius: 22px; box-shadow: 0 6px 24px rgba(0, 0, 0, .12); }
    .card { padding: 16px; margin-top: 14px; }
    .card h3 { margin: 0 0 10px; font-size: 15px; font-weight: 600; letter-spacing: .3px; opacity: .9; }

    form.search { display: flex; gap: 8px; }
    form.search input { flex: 1; padding: 13px 18px; font-size: 16px; color: #fff; border-radius: 30px; outline: none;
      background: rgba(255, 255, 255, .2); border: 1px solid rgba(255, 255, 255, .35); }
    form.search input::placeholder { color: rgba(255, 255, 255, .7); }
    button { cursor: pointer; font-size: 14px; color: #fff; padding: 10px 16px; border-radius: 30px;
      background: rgba(255, 255, 255, .22); border: 1px solid rgba(255, 255, 255, .35); }
    button:hover { background: rgba(255, 255, 255, .35); }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
    .chips label { font-size: 13px; opacity: .9; cursor: pointer; margin-left: auto; }

    .status { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px; margin-top: 12px; font-size: 12.5px; opacity: .9; }
    .badge { padding: 2px 10px; border-radius: 12px; font-weight: 600; }
    .on { background: #2b8a3e; } .off { background: #c92a2a; }

    .errbox { margin-top: 14px; padding: 12px 16px; border-radius: 16px; background: rgba(200, 30, 30, .55); border: 1px solid rgba(255, 255, 255, .35); }

    .hero { text-align: center; padding: 22px 10px 6px; }
    .stale { display: inline-block; font-size: 12.5px; padding: 4px 12px; border-radius: 14px; background: rgba(255, 180, 0, .45); margin-bottom: 8px; }
    .city { font-size: 30px; font-weight: 600; letter-spacing: .5px; }
    .icon { font-size: 86px; line-height: 1.2; animation: floaty 5s ease-in-out infinite; filter: drop-shadow(0 8px 12px rgba(0, 0, 0, .25)); }
    @keyframes floaty { 50% { transform: translateY(-8px); } }
    .temp { font-size: 78px; font-weight: 200; line-height: 1; }
    .cond { font-size: 20px; margin-top: 6px; }
    .hl { font-size: 15px; opacity: .9; margin-top: 4px; }
    .rec { font-size: 12px; opacity: .75; margin-top: 8px; }

    .alertbox { padding: 12px 16px; margin-top: 12px; font-size: 14px; font-weight: 600; text-align: center; }
    .hourly { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
    .hour { min-width: 60px; text-align: center; padding: 8px 4px; border-radius: 14px; background: rgba(255, 255, 255, .1); }
    .hour .t { font-size: 12px; opacity: .85; } .hour .i { font-size: 24px; margin: 4px 0; } .hour .d { font-weight: 600; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
    .tile { padding: 14px 16px; } .tile span { display: block; font-size: 13px; opacity: .85; } .tile b { font-size: 24px; font-weight: 500; }
    .day { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid rgba(255, 255, 255, .15); font-size: 14px; }
    .day:last-child { border-bottom: none; }
    .day .n { width: 78px; font-weight: 600; } .day .i { font-size: 24px; width: 34px; text-align: center; }
    .day .c { flex: 1; opacity: .9; } .day .r { opacity: .85; width: 56px; text-align: right; } .day .m { width: 84px; text-align: right; }

    .chart-box { position: relative; height: 240px; }
    .hint { font-size: 12.5px; opacity: .85; margin: 8px 0 0; }
    .tablewrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; white-space: nowrap; }
    th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid rgba(255, 255, 255, .15); }
    .tools { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .foot { text-align: center; font-size: 12px; opacity: .75; margin-top: 18px; }
  </style>
</head>
<body class="sunny">
  <div id="sun"></div>
  <div id="moon"></div>
  <div id="fx"></div>

  <div class="wrap">
    <form id="form" class="search">
      <input type="text" id="city" value="Karachi" placeholder="Search city..." autocomplete="off">
      <button type="submit">Search</button>
    </form>
    <div class="chips">
      <button data-city="Karachi">Karachi</button>
      <button data-city="Lahore">Lahore</button>
      <button data-city="Islamabad">Islamabad</button>
      <label><input type="checkbox" id="auto"> Auto-collect (60 s)</label>
    </div>
    <div class="status">
      <span>Last successful update: <b id="updated">none yet</b></span>
      <span>Connection: <span id="net" class="badge on">Online</span></span>
    </div>

    <div id="msg"></div>
    <div id="hero"></div>
    <div id="alert"></div>
    <div id="details"></div>
    <div id="hourlyBox"></div>
    <div id="forecast"></div>

    <div class="glass card">
      <h3>Temperature trend (saved data)</h3>
      <div class="chart-box"><canvas id="tempChart"></canvas></div>
    </div>
    <div class="glass card">
      <h3>Humidity and wind trend (saved data)</h3>
      <div class="chart-box"><canvas id="humChart"></canvas></div>
      <p class="hint" id="chartNote"></p>
    </div>

    <div class="glass card">
      <h3>Saved weather snapshots (latest 10)</h3>
      <div class="tablewrap" id="history"></div>
      <div class="tools">
        <button id="export">Export CSV</button>
        <button id="clear">Clear history</button>
      </div>
    </div>
    <p class="foot">Data source: Open-Meteo API (free, no API key)</p>
  </div>

  <script>
    var WEATHER_CODES = {
      0: "Clear sky", 1: "Mainly clear", 2: "Partly cloudy", 3: "Overcast",
      45: "Fog", 48: "Depositing rime fog",
      51: "Light drizzle", 53: "Moderate drizzle", 55: "Dense drizzle",
      56: "Light freezing drizzle", 57: "Dense freezing drizzle",
      61: "Slight rain", 63: "Moderate rain", 65: "Heavy rain",
      66: "Light freezing rain", 67: "Heavy freezing rain",
      71: "Slight snow", 73: "Moderate snow", 75: "Heavy snow", 77: "Snow grains",
      80: "Slight rain showers", 81: "Moderate rain showers", 82: "Violent rain showers",
      85: "Slight snow showers", 86: "Heavy snow showers",
      95: "Thunderstorm", 96: "Thunderstorm with hail", 99: "Thunderstorm with heavy hail"
    };
    var KNOWN = {
      "karachi": ["Karachi", 24.8607, 67.0011],
      "lahore": ["Lahore", 31.5204, 74.3587],
      "islamabad": ["Islamabad", 33.6844, 73.0479]
    };
    var STORE_KEY = "weatherSnapshots";
    var $ = function (id) { return document.getElementById(id); };
    var currentCity = "Karachi", charts = {}, timer = null, lastTheme = "";

    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }
    function rnd(a, b) { return a + Math.random() * (b - a); }

    /* ---------- weather helpers ---------- */
    function iconFor(code, isDay) {
      if (code === 0) return isDay ? "☀️" : "🌙";
      if (code === 1) return isDay ? "🌤️" : "🌙";
      if (code === 2) return isDay ? "⛅" : "☁️";
      if (code === 3) return "☁️";
      if (code === 45 || code === 48) return "🌫️";
      if ([51, 53, 55, 56, 57].indexOf(code) >= 0) return "🌦️";
      if ([61, 63, 65, 66, 67, 80, 81, 82].indexOf(code) >= 0) return "🌧️";
      if ([71, 73, 75, 77, 85, 86].indexOf(code) >= 0) return "❄️";
      if (code >= 95) return "⛈️";
      return "🌡️";
    }
    function themeFor(code, isDay) {
      if (code >= 95) return "storm";
      if ([71, 73, 75, 77, 85, 86].indexOf(code) >= 0) return "snow";
      if ([51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82].indexOf(code) >= 0) return "rain";
      if (code === 45 || code === 48) return "fog";
      if (code === 3) return "cloudy";
      if (!isDay) return "night";
      if (code === 2) return "sunny partly";
      return "sunny";
    }
    function getAlert(code, wind) {
      if (code >= 95) return "Alert: Thunderstorm conditions are possible.";
      if (code === 65 || code === 82) return "Alert: Heavy rain is possible.";
      if (wind >= 40) return "Alert: Strong winds are possible.";
      return "No severe weather alert for the current conditions.";
    }

    /* ---------- animated background ---------- */
    function buildFx(theme) {
      var fx = $("fx");
      fx.innerHTML = "";
      var n = 3;
      if (theme.indexOf("partly") >= 0) n = 6;
      else if (theme === "cloudy" || theme === "rain" || theme === "storm" || theme === "fog") n = 7;
      else if (theme === "snow") n = 5;
      for (var i = 0; i < n; i++) {
        var c = document.createElement("div");
        c.className = "cloud";
        c.style.top = rnd(4, 50) + "%";
        c.style.fontSize = rnd(11, 22) + "px";
        c.style.animationDuration = rnd(50, 110) + "s";
        c.style.animationDelay = "-" + rnd(0, 100) + "s";
        fx.appendChild(c);
      }
      var count, k, el;
      if (theme === "rain" || theme === "storm") {
        count = theme === "storm" ? 110 : 80;
        for (k = 0; k < count; k++) {
          el = document.createElement("div");
          el.className = "drop";
          el.style.left = rnd(0, 100) + "%";
          el.style.animationDuration = rnd(0.55, 1.0) + "s";
          el.style.animationDelay = "-" + rnd(0, 2) + "s";
          fx.appendChild(el);
        }
        if (theme === "storm") { el = document.createElement("div"); el.className = "flash"; fx.appendChild(el); }
      }
      if (theme === "snow") {
        for (k = 0; k < 60; k++) {
          el = document.createElement("div");
          el.className = "flake";
          var s = rnd(3, 8);
          el.style.width = s + "px"; el.style.height = s + "px";
          el.style.left = rnd(0, 100) + "%";
          el.style.animationDuration = rnd(6, 13) + "s";
          el.style.animationDelay = "-" + rnd(0, 13) + "s";
          fx.appendChild(el);
        }
      }
      if (theme === "night") {
        for (k = 0; k < 70; k++) {
          el = document.createElement("div");
          el.className = "star";
          el.style.left = rnd(0, 100) + "%";
          el.style.top = rnd(0, 65) + "%";
          el.style.animationDelay = "-" + rnd(0, 3) + "s";
          fx.appendChild(el);
        }
      }
    }
    function applyTheme(code, isDay) {
      var t = themeFor(code, isDay);
      document.body.className = t;
      if (t !== lastTheme) { lastTheme = t; buildFx(t); }
    }

    /* ---------- storage ---------- */
    function loadStore() {
      try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; } catch (e) { return []; }
    }
    function saveStore(rows) {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(rows.slice(-500))); } catch (e) {}
    }

    /* ---------- API (request -> Internet -> API server -> JSON) ---------- */
    async function fetchJson(url) {
      var controller = new AbortController();
      var timeout = setTimeout(function () { controller.abort(); }, 10000);
      try {
        var res = await fetch(url, { signal: controller.signal });
        if (!res.ok) throw new Error("Weather service error (HTTP " + res.status + ").");
        return await res.json();
      } catch (e) {
        if (e.name === "AbortError") throw new Error("Request timed out. Please try again.");
        if (e instanceof TypeError) throw new Error("No internet connection, or the weather service is unreachable.");
        throw e;
      } finally {
        clearTimeout(timeout);
      }
    }
    async function findLocation(city) {
      city = city.trim();
      if (!city) throw new Error("Please enter a city name.");
      var known = KNOWN[city.toLowerCase()];
      if (known) return known;
      var data = await fetchJson("https://geocoding-api.open-meteo.com/v1/search?name=" +
        encodeURIComponent(city) + "&count=1&language=en&format=json");
      if (!data.results || !data.results.length) throw new Error('City "' + city + '" was not found.');
      var r = data.results[0];
      return [r.name, r.latitude, r.longitude];
    }

    /* ---------- rendering ---------- */
    function renderWeather(snap, extra, stale) {
      var isDay = snap.isDay !== false;
      applyTheme(snap.code, isDay);
      var d = extra && extra.daily;

      var hl = d ? '<div class="hl">H: ' + Math.round(d.temperature_2m_max[0]) + '°C &nbsp; L: ' + Math.round(d.temperature_2m_min[0]) + '°C</div>' : "";
      $("hero").innerHTML = '<div class="hero">' +
        (stale ? '<div class="stale">Showing last saved data (may be outdated)</div>' : "") +
        '<div class="city">' + esc(snap.city) + '</div>' +
        '<div class="icon">' + iconFor(snap.code, isDay) + '</div>' +
        '<div class="temp">' + Math.round(snap.temperature) + '°C</div>' +
        '<div class="cond">' + esc(snap.condition) + '</div>' + hl +
        '<div class="rec">Recorded ' + esc(new Date(snap.time).toLocaleString()) + '</div></div>';

      var msg = getAlert(snap.code, snap.wind);
      $("alert").innerHTML = '<div class="glass alertbox">' + (msg.indexOf("Alert") === 0 ? "⚠️ " : "✅ ") + esc(msg) + '</div>';

      var tiles = '<div class="glass tile"><span>💧 Humidity</span><b>' + snap.humidity + ' %</b></div>' +
        '<div class="glass tile"><span>💨 Wind speed</span><b>' + snap.wind + ' km/h</b></div>';
      if (snap.feels !== undefined && snap.feels !== null) {
        tiles += '<div class="glass tile"><span>🌡️ Feels like</span><b>' + Math.round(snap.feels) + ' °C</b></div>';
      }
      if (d) {
        tiles += '<div class="glass tile"><span>☔ Rain chance today</span><b>' + d.precipitation_probability_max[0] + ' %</b></div>';
      }
      $("details").innerHTML = '<div class="grid">' + tiles + '</div>';

      if (extra && extra.hourly) {
        var h = extra.hourly, start = h.time.indexOf(extra.current.time.slice(0, 13) + ":00");
        if (start < 0) start = 0;
        var items = "";
        for (var i = start; i < Math.min(start + 24, h.time.length); i++) {
          items += '<div class="hour"><div class="t">' + (i === start ? "Now" : h.time[i].slice(11, 16)) + '</div>' +
            '<div class="i">' + iconFor(h.weather_code[i], h.is_day[i] === 1) + '</div>' +
            '<div class="d">' + Math.round(h.temperature_2m[i]) + '°</div></div>';
        }
        $("hourlyBox").innerHTML = '<div class="glass card"><h3>Next 24 hours (°C)</h3><div class="hourly">' + items + '</div></div>';
      } else {
        $("hourlyBox").innerHTML = "";
      }

      if (d) {
        var rows = "";
        d.time.forEach(function (date, i) {
          var label = i === 0 ? "Today" : new Date(date + "T12:00").toLocaleDateString([], { weekday: "short", day: "numeric", month: "short" });
          rows += '<div class="day"><span class="n">' + esc(label) + '</span>' +
            '<span class="i">' + iconFor(d.weather_code[i], true) + '</span>' +
            '<span class="c">' + esc(WEATHER_CODES[d.weather_code[i]] || "Unknown condition") + '</span>' +
            '<span class="r">☔ ' + d.precipitation_probability_max[i] + '%</span>' +
            '<span class="m">' + Math.round(d.temperature_2m_min[i]) + '° / ' + Math.round(d.temperature_2m_max[i]) + '°C</span></div>';
        });
        $("forecast").innerHTML = '<div class="glass card"><h3>3-day forecast</h3>' + rows + '</div>';
      } else {
        $("forecast").innerHTML = "";
      }
    }

    function gradient(color) {
      return function (context) {
        var chart = context.chart, area = chart.chartArea;
        if (!area) return color.replace("1)", ".25)");
        var g = chart.ctx.createLinearGradient(0, area.top, 0, area.bottom);
        g.addColorStop(0, color.replace("1)", ".6)"));
        g.addColorStop(1, color.replace("1)", "0)"));
        return g;
      };
    }
    function makeChart(id, config) {
      if (charts[id]) charts[id].destroy();
      charts[id] = new Chart($(id), config);
    }
    function renderCharts(city) {
      if (typeof Chart === "undefined") {
        $("chartNote").textContent = "Charts could not load (Chart.js needs internet).";
        return;
      }
      Chart.defaults.color = "rgba(255,255,255,.9)";
      Chart.defaults.font.family = '"Segoe UI", Roboto, Arial, sans-serif';
      var rows = loadStore().filter(function (r) { return r.city === city; }).slice(-20);
      var labels = rows.map(function (r) {
        return new Date(r.time).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      });
      var grid = { color: "rgba(255,255,255,.15)" };
      var point = { pointRadius: 4, pointHoverRadius: 6, pointBackgroundColor: "#fff", borderWidth: 3, tension: 0.4, fill: true };

      makeChart("tempChart", {
        type: "line",
        data: { labels: labels, datasets: [Object.assign({
          label: "Temperature (°C)", data: rows.map(function (r) { return r.temperature; }),
          borderColor: "rgba(255,214,102,1)", backgroundColor: gradient("rgba(255,214,102,1)")
        }, point)] },
        options: { responsive: true, maintainAspectRatio: false,
          plugins: { legend: { labels: { usePointStyle: true } } },
          scales: { x: { grid: grid }, y: { grid: grid, title: { display: true, text: "°C" } } } }
      });
      makeChart("humChart", {
        type: "line",
        data: { labels: labels, datasets: [
          Object.assign({ label: "Humidity (%)", data: rows.map(function (r) { return r.humidity; }),
            borderColor: "rgba(142,197,255,1)", backgroundColor: gradient("rgba(142,197,255,1)"), yAxisID: "y" }, point),
          Object.assign({ label: "Wind (km/h)", data: rows.map(function (r) { return r.wind; }),
            borderColor: "rgba(184,242,160,1)", backgroundColor: "rgba(184,242,160,0)", fill: false, yAxisID: "y1" },
            { pointRadius: 4, pointBackgroundColor: "#fff", borderWidth: 3, tension: 0.4 })
        ] },
        options: { responsive: true, maintainAspectRatio: false,
          plugins: { legend: { labels: { usePointStyle: true } } },
          scales: {
            x: { grid: grid },
            y: { position: "left", grid: grid, title: { display: true, text: "Humidity (%)" } },
            y1: { position: "right", grid: { drawOnChartArea: false }, title: { display: true, text: "Wind (km/h)" } }
          } }
      });
      $("chartNote").textContent = rows.length + " saved snapshot(s) for " + city + "." +
        (rows.length < 2 ? " Search again later or turn on Auto-collect to build the trend." : "");
    }

    function renderHistory() {
      var rows = loadStore().slice(-10).reverse();
      if (!rows.length) { $("history").innerHTML = "<p>No snapshots saved yet.</p>"; return; }
      var html = "<table><tr><th>Time</th><th>City</th><th>Temp (°C)</th><th>Humidity (%)</th><th>Wind (km/h)</th><th>Condition</th></tr>";
      rows.forEach(function (r) {
        html += "<tr><td>" + esc(new Date(r.time).toLocaleString()) + "</td><td>" + esc(r.city) + "</td><td>" + r.temperature +
          "</td><td>" + r.humidity + "</td><td>" + r.wind + "</td><td>" + esc(r.condition) + "</td></tr>";
      });
      $("history").innerHTML = html + "</table>";
    }

    function showError(text) { $("msg").innerHTML = '<div class="errbox">⚠️ ' + esc(text) + '</div>'; }
    function setUpdated(iso) { $("updated").textContent = new Date(iso).toLocaleString(); }

    /* ---------- main flow ---------- */
    async function load(city) {
      try {
        var loc = await findLocation(city);
        var name = loc[0], lat = loc[1], lon = loc[2];
        var url = "https://api.open-meteo.com/v1/forecast?latitude=" + lat + "&longitude=" + lon +
          "&current=temperature_2m,relative_humidity_2m,apparent_temperature,wind_speed_10m,weather_code,is_day" +
          "&hourly=temperature_2m,weather_code,is_day" +
          "&daily=temperature_2m_max,temperature_2m_min,weather_code,precipitation_probability_max" +
          "&temperature_unit=celsius&wind_speed_unit=kmh&timezone=auto&forecast_days=3";
        var data = await fetchJson(url);

        // Parse the JSON response
        var c = data.current, d = data.daily;
        if (!c || !d) throw new Error("Weather service returned incomplete data.");
        var snap = {
          city: name,
          time: new Date().toISOString(),
          temperature: c.temperature_2m,
          humidity: c.relative_humidity_2m,
          wind: c.wind_speed_10m,
          feels: c.apparent_temperature,
          code: c.weather_code,
          isDay: c.is_day === 1,
          condition: WEATHER_CODES[c.weather_code] || "Unknown condition"
        };

        // Store the timestamped snapshot
        var rows = loadStore();
        rows.push(snap);
        saveStore(rows);

        currentCity = name;
        $("msg").innerHTML = "";
        renderWeather(snap, { current: c, daily: d, hourly: data.hourly }, false);
        setUpdated(snap.time);
        renderCharts(name);
        renderHistory();
      } catch (err) {
        showError(err.message);
        var saved = loadStore().filter(function (r) { return r.city.toLowerCase() === city.trim().toLowerCase(); });
        if (saved.length) {
          var last = saved[saved.length - 1];
          currentCity = last.city;
          renderWeather(last, null, true);
          setUpdated(last.time);
          renderCharts(last.city);
        }
        renderHistory();
      }
    }

    function setNet() {
      var online = navigator.onLine;
      $("net").textContent = online ? "Online" : "Offline";
      $("net").className = "badge " + (online ? "on" : "off");
    }

    $("form").addEventListener("submit", function (e) { e.preventDefault(); load($("city").value); });
    document.querySelectorAll(".chips button").forEach(function (b) {
      b.addEventListener("click", function () { $("city").value = b.dataset.city; load(b.dataset.city); });
    });
    $("auto").addEventListener("change", function () {
      if (timer) { clearInterval(timer); timer = null; }
      if ($("auto").checked) timer = setInterval(function () { load(currentCity); }, 60000);
    });
    $("export").addEventListener("click", function () {
      var csv = "time,city,temperature_c,humidity_percent,wind_kmh,condition\n";
      loadStore().forEach(function (r) {
        csv += [r.time, r.city, r.temperature, r.humidity, r.wind, '"' + r.condition + '"'].join(",") + "\n";
      });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
      a.download = "weather_history.csv";
      a.click();
    });
    $("clear").addEventListener("click", function () {
      if (confirm("Delete all saved weather snapshots?")) {
        saveStore([]);
        renderHistory();
        renderCharts(currentCity);
      }
    });
    window.addEventListener("online", function () { setNet(); load(currentCity); });
    window.addEventListener("offline", setNet);

    setNet();
    buildFx("sunny");
    load("Karachi");
  </script>
</body>
</html>
